name: Idea or feature request
description: Something Logbeam could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what's hard about it today, e.g. "I compare two Jenkins runs and …".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. A sample of the log it's about helps a lot (with secrets removed).
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd like to try a pull request for this
