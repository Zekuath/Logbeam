# Weekly updates of the build and test tools, grouped into one pull request so CI runs once.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint supports TypeScript below 6.1, so 6.1 and 7 wait until it does
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
